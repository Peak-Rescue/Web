name: Keep Supabase Project Alive

on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days at noon UTC
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Call a dedicated no-data RPC so the request actually hits
          # Postgres (the auth /health endpoint does not, so it would not
          # count as activity for Supabase's auto-pause check). Real tables
          # are no longer anon-readable since the RLS hardening.
          curl -fsS -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "https://qejyeetwurhszyirhpxd.supabase.co/rest/v1/rpc/keep_alive"
